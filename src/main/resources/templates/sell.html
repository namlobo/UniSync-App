<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniSync - List Resource</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <div class="shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main">
      <div class="topbar">
        <div class="page-header">
          <h1>Sell or List Resource</h1>
          <p>Post a new item for sale, lending, or barter on campus</p>
        </div>
      </div>

      <div th:if="${error}" class="flash bad">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${error}">Error</span>
      </div>
      <div th:if="${success}" class="flash ok">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${success}">Success</span>
      </div>

      <div class="card" style="max-width: 800px;">
        <form method="post" action="/ui/sell">
          <label>Resource Title *</label>
          <input name="title" placeholder="e.g. Operating System Concepts (9th Edition)" required>

          <label>Description & Notes</label>
          <textarea name="description" placeholder="Provide details like edition, highlights, included accessories, or pickup location..."></textarea>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
            <div>
              <label>Category *</label>
              <select name="categoryId" required>
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.displayName}">Category</option>
                <option th:if="${categories == null or categories.isEmpty()}" value="1">Textbooks - Engineering</option>
              </select>
            </div>

            <div>
              <label>Item Condition *</label>
              <select name="condition" required>
                <option value="New">New / Unopened</option>
                <option value="Excellent">Excellent</option>
                <option value="Good" selected>Good</option>
                <option value="Fair">Fair / Used</option>
              </select>
            </div>

            <div>
              <label>Listing Type *</label>
              <select id="type" name="type" required>
                <option value="SELL">SELL (For Sale)</option>
                <option value="LEND">LEND (Free / Loan)</option>
                <option value="BARTER">BARTER (Exchange)</option>
              </select>
            </div>

            <div id="priceWrap">
              <label>Selling Price ($) *</label>
              <input id="price" name="price" type="number" step="0.01" min="0.01" value="25.00" placeholder="0.00">
            </div>
          </div>

          <div style="margin-top: 28px; display: flex; gap: 12px; align-items: center;">
            <button type="submit" class="btn btn-primary btn-full">
              <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Publish Listing Now
            </button>
          </div>
        </form>
      </div>

      <script>
        (function () {
          const type = document.getElementById('type');
          const wrap = document.getElementById('priceWrap');
          const price = document.getElementById('price');
          function sync() {
            const isSell = type.value === 'SELL';
            wrap.style.display = isSell ? 'block' : 'none';
            price.required = isSell;
            if (!isSell) price.value = '0';
          }
          type.addEventListener('change', sync);
          sync();
        })();
      </script>
    </main>
  </div>
</body>
</html>
