<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniSync - Buy Marketplace</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <div class="shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main">
      <div class="topbar">
        <div class="page-header">
          <h1>Buy Marketplace</h1>
          <p th:text="${count + ' items available for immediate purchase'}">0 items available for sale</p>
        </div>
      </div>

      <div th:if="${error}" class="flash bad">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${error}">Error</span>
      </div>
      <div th:if="${success}" class="flash ok">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${success}">Success</span>
      </div>

      <div class="resource-grid" th:if="${resources != null and !resources.isEmpty()}">
        <div class="res-card" th:each="r : ${resources}">
          <div>
            <div class="res-header">
              <span class="res-title" th:text="${r.title}">Title</span>
              <span class="badge badge-sell">SELL</span>
            </div>
            
            <p class="res-desc" th:text="${r.description != null and !r.description.isEmpty() ? r.description : 'No description provided.'}">Description</p>
            
            <div class="res-meta">
              <span class="badge badge-cat" th:text="${r.category.displayName}">Category</span>
              <span class="badge badge-cat" th:text="${'Condition: ' + r.condition}">Good</span>
              <span class="badge badge-available">AVAILABLE</span>
            </div>

            <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
              <div class="price-tag" th:text="${'$' + #numbers.formatDecimal(r.price, 1, 2)}">$0.00</div>
              <span style="font-size: 11.5px; color: var(--text-dim);">Fixed Price</span>
            </div>
          </div>

          <div>
            <div class="res-owner">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span th:text="${'Seller: ' + r.owner.name + ' (' + r.owner.department + ')'}">Owner</span>
            </div>

            <form method="post" action="/ui/buy" style="margin-top: 14px;">
              <input type="hidden" name="resourceId" th:value="${r.resourceId}">
              <button type="submit" class="btn btn-primary btn-full">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                Confirm Purchase
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="empty-state card" th:if="${resources == null or resources.isEmpty()}">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <h3>No Items For Sale Right Now</h3>
        <p>Items listed for sale by other students will appear here automatically.</p>
        <a href="/ui/resources" class="btn btn-secondary" style="margin-top: 16px;">Browse All Resources</a>
      </div>
    </main>
  </div>
</body>
</html>
