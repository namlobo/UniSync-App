<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniSync - Reminders & Notifications</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <div class="shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main">
      <div class="topbar">
        <div class="page-header">
          <h1>Reminders & Notifications</h1>
          <p>Due dates, transaction updates, and loan reminders</p>
        </div>
      </div>

      <div th:if="${error}" class="flash bad">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${error}">Error</span>
      </div>
      <div th:if="${success}" class="flash ok">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span th:text="${success}">Success</span>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Reminder Date</th>
                <th>Notification Message</th>
                <th>Status</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(reminders)}">
                <td colspan="5" style="text-align:center; color: var(--text-muted); padding: 36px 0;">
                  No active reminders or notifications.
                </td>
              </tr>
              <tr th:each="r : ${reminders}">
                <td th:text="${'#REM-' + r.reminderId}">#REM-0</td>
                <td th:text="${r.reminderDate}">-</td>
                <td style="color: #fff; font-weight: 500;" th:text="${r.message}">-</td>
                <td>
                  <span th:if="${r.status == 'UNREAD'}" class="badge badge-borrowed">UNREAD</span>
                  <span th:if="${r.status != 'UNREAD'}" class="badge badge-cat">READ</span>
                </td>
                <td style="text-align: right;">
                  <form th:if="${r.status == 'UNREAD'}" method="post" action="/ui/reminders/read" style="display:inline;">
                    <input type="hidden" name="reminderId" th:value="${r.reminderId}">
                    <button type="submit" class="btn btn-secondary btn-sm">Mark Read</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
